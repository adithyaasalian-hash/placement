<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock, Paper, Scissors</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #637083;
      --paper: #fffdf8;
      --line: #e7dfd2;
      --coral: #e46c52;
      --coral-dark: #b94c38;
      --teal: #267f7d;
      --gold: #e2a83b;
      --shadow: 0 24px 70px rgba(48, 42, 33, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(226, 168, 59, 0.18), transparent 30%),
        radial-gradient(circle at 94% 90%, rgba(38, 127, 125, 0.15), transparent 32%),
        #f3eee5;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .game {
      width: min(100%, 760px);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(231, 223, 210, 0.9);
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: arrive 600ms ease-out both;
    }

    header {
      position: relative;
      padding: 42px 28px 30px;
      color: #fffaf2;
      background: var(--teal);
      text-align: center;
    }

    header::after {
      content: '';
      position: absolute;
      right: -45px;
      bottom: -65px;
      width: 170px;
      height: 170px;
      border: 2px solid rgba(255, 250, 242, 0.2);
      border-radius: 50%;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #bde2d9;
      font: 700 0.72rem/1.2 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4.5rem);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 16px 0 0;
      color: #e4f2ed;
      font: 0.98rem/1.5 Arial, sans-serif;
    }

    main { padding: 30px; }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
      text-align: center;
    }

    .score {
      padding: 16px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffaf1;
    }

    .score strong {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font: 700 0.68rem/1.2 Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .score span {
      display: block;
      color: var(--coral-dark);
      font-size: 2.5rem;
      line-height: 1;
    }

    .versus {
      color: var(--gold);
      font: 700 0.82rem/1 Arial, sans-serif;
      letter-spacing: 0.1em;
    }

    .arena {
      min-height: 180px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border: 1px dashed #d8ccb9;
      border-radius: 14px;
      background: #fbf6ec;
      text-align: center;
    }

    .fighter-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font: 700 0.68rem/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .choice-display {
      min-height: 54px;
      color: var(--ink);
      font-size: 1.45rem;
      font-weight: 700;
    }

    .choice-display small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font: 0.75rem/1.2 Arial, sans-serif;
      font-weight: 400;
    }

    .arena-mark {
      color: var(--gold);
      font: 700 1.2rem/1 Arial, sans-serif;
    }

    .result {
      min-height: 48px;
      margin: 22px 0 24px;
      color: var(--coral-dark);
      font-size: 1.55rem;
      line-height: 1.1;
      text-align: center;
    }

    .result small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font: 0.83rem/1.3 Arial, sans-serif;
    }

    .prompt {
      margin: 0 0 13px;
      color: var(--muted);
      font: 700 0.72rem/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .moves {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 72px;
      padding: 12px 8px;
      color: var(--ink);
      font: 700 1rem Georgia, 'Times New Roman', serif;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover, button:focus-visible {
      background: #fff8eb;
      border-color: var(--coral);
      box-shadow: 0 8px 20px rgba(228, 108, 82, 0.16);
      outline: none;
      transform: translateY(-3px);
    }

    button:active { transform: translateY(0); }

    .move-icon {
      display: block;
      margin-bottom: 6px;
      color: var(--coral);
      font: 700 1.35rem/1 Arial, sans-serif;
    }

    .reset {
      display: block;
      min-height: auto;
      margin: 22px auto 0;
      padding: 8px 14px;
      color: var(--muted);
      font: 700 0.72rem/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .reset:hover, .reset:focus-visible {
      color: var(--coral-dark);
      background: transparent;
      border: 0;
      box-shadow: none;
      transform: none;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      main { padding: 22px 16px 24px; }
      header { padding: 34px 20px 27px; }
      .arena { padding: 16px 8px; gap: 8px; }
      .choice-display { font-size: 1.1rem; }
      .moves { gap: 8px; }
      button { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <section class="game" aria-label="Rock paper scissors game">
    <header>
      <p class="eyebrow">A tiny battle of wits</p>
      <h1>Rock, Paper, Scissors</h1>
      <p class="subtitle">Choose your move. The first player to five wins.</p>
    </header>

    <main>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score"><strong>You</strong><span id="player-score">0</span></div>
        <div class="versus">VS</div>
        <div class="score"><strong>Computer</strong><span id="computer-score">0</span></div>
      </div>

      <div class="arena" aria-live="polite">
        <div>
          <span class="fighter-label">Your move</span>
          <div class="choice-display" id="player-choice">Ready?<small>Make the first move</small></div>
        </div>
        <div class="arena-mark">:</div>
        <div>
          <span class="fighter-label">Their move</span>
          <div class="choice-display" id="computer-choice">Waiting<small>The computer is ready</small></div>
        </div>
      </div>

      <div class="result" id="result">Pick a move to begin.<small>Rock beats scissors, scissors beat paper, paper beats rock.</small></div>

      <p class="prompt">Choose your move</p>
      <div class="moves">
        <button type="button" data-move="rock"><span class="move-icon">R</span>Rock</button>
        <button type="button" data-move="paper"><span class="move-icon">P</span>Paper</button>
        <button type="button" data-move="scissors"><span class="move-icon">S</span>Scissors</button>
      </div>
      <button class="reset" id="reset" type="button">Reset game</button>
    </main>
  </section>

  <script>
    const moves = ['rock', 'paper', 'scissors'];
    const labels = { rock: 'Rock', paper: 'Paper', scissors: 'Scissors' };
    const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
    let playerScore = 0;
    let computerScore = 0;

    const playerScoreElement = document.querySelector('#player-score');
    const computerScoreElement = document.querySelector('#computer-score');
    const playerChoiceElement = document.querySelector('#player-choice');
    const computerChoiceElement = document.querySelector('#computer-choice');
    const resultElement = document.querySelector('#result');

    function setChoice(element, choice, note) {
      element.innerHTML = `${labels[choice]}<small>${note}</small>`;
    }

    function playRound(playerMove) {
      if (playerScore === 5 || computerScore === 5) return;

      const computerMove = moves[Math.floor(Math.random() * moves.length)];
      setChoice(playerChoiceElement, playerMove, 'Your choice');
      setChoice(computerChoiceElement, computerMove, 'Computer choice');

      if (playerMove === computerMove) {
        resultElement.innerHTML = `A draw.`;
      } else if (beats[playerMove] === computerMove) {
        playerScore += 1;
        resultElement.innerHTML = `You win this round.`;
      } else {
        computerScore += 1;
        resultElement.innerHTML = `Computer wins this round.`;
      }

      playerScoreElement.textContent = playerScore;
      computerScoreElement.textContent = computerScore;

      if (playerScore === 5 || computerScore === 5) {
        const winner = playerScore === 5 ? 'You win the match!' : 'The computer wins the match.';
        resultElement.innerHTML = `${winner}<small>Press Reset game to play again.</small>`;
      } else {
        resultElement.innerHTML += `<small>First to five wins.</small>`;
      }
    }

    function resetGame() {
      playerScore = 0;
      computerScore = 0;
      playerScoreElement.textContent = '0';
      computerScoreElement.textContent = '0';
      playerChoiceElement.innerHTML = 'Ready?<small>Make the first move</small>';
      computerChoiceElement.innerHTML = 'Waiting<small>The computer is ready</small>';
      resultElement.innerHTML = 'Pick a move to begin.<small>Rock beats scissors, scissors beat paper, paper beats rock.</small>';
    }

    document.querySelectorAll('[data-move]').forEach((button) => {
      button.addEventListener('click', () => playRound(button.dataset.move));
    });
    document.querySelector('#reset').addEventListener('click', resetGame);
  </script>
</body>
</html>
